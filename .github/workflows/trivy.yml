name: trivy
on:
  push: { branches: [main, master] }
  pull_request:
  schedule: [{ cron: '17 5 * * 1' }]   # wöchentlich Mo: neue CVEs in unveränderten Repos
  workflow_dispatch:
permissions: { contents: read, security-events: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies + Secrets (Gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: node_modules,.next,dist
      - name: Misconfig (nur Report, kein Gate)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: SARIF (Security-Tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          skip-dirs: node_modules,.next,dist
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true   # private Repos ohne GHAS
        with: { sarif_file: trivy.sarif }
